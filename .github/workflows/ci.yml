name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.19, 22, 24]
        exclude:
          - os: windows-latest
            node: 20.19
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js --version
      - run: node dist/index.js --help
      - run: npx publint

  e2e:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        combo:
          - --router=tanstack --query --linter=eslint
          - --router=react-router --query --linter=oxlint
          - --router=none --linter=biome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Gerar projeto e validar
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          node $GITHUB_WORKSPACE/dist/index.js app --yes ${{ matrix.combo }} --no-git
          cd app
          npm run build
          npm run lint
